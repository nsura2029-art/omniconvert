name = "omniconvert"
compatibility_date = "2026-06-26"

# Cloudflare Workers static assets deployment for the Vite build output.
# See: https://developers.cloudflare.com/workers/static-assets/
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[vars]
APP_ENV = "production"

# Future database binding example. Uncomment after creating a D1 database:
# wrangler d1 create omniconvert
# [[d1_databases]]
# binding = "DB"
# database_name = "omniconvert"
# database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
